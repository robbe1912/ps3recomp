name: Guest read sync gate
on:
  workflow_dispatch:
  push:
    branches: [combined, codex/frame60-fastmem-diet]
    paths:
      - 'include/ps3emu/guest_read_sync.h'
      - 'runtime/memory/guest_read_sync.c'
      - 'tests/guest_read_sync_gate_harness.c'
      - 'tests/check_guest_read_sync_gate.py'
      - '.github/workflows/guest-read-sync-gate.yml'
  pull_request:
    paths:
      - 'include/ps3emu/guest_read_sync.h'
      - 'runtime/memory/guest_read_sync.c'
      - 'tests/guest_read_sync_gate_harness.c'
      - 'tests/check_guest_read_sync_gate.py'
      - '.github/workflows/guest-read-sync-gate.yml'
jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python tests/check_guest_read_sync_gate.py

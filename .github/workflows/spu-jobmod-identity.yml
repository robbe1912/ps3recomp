name: SPU jobmod header identity
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['runtime/spu/spu_jobmod_identity.h', 'runtime/spu/tests/test_spu_jobmod_identity.c', 'tools/test_spu_jobmod_identity.py', '.github/workflows/spu-jobmod-identity.yml']
  pull_request:
    paths: ['runtime/spu/spu_jobmod_identity.h', 'runtime/spu/tests/test_spu_jobmod_identity.c', 'tools/test_spu_jobmod_identity.py', '.github/workflows/spu-jobmod-identity.yml']
  workflow_dispatch:
jobs:
  identity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_spu_jobmod_identity.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spu-jobmod-identity-${{ matrix.os }}
          path: |
            build/spu-jobmod-identity-tests/**/*.log
            build/spu-jobmod-identity-tests/**/*.json
          retention-days: 5

name: CPU surface prompt service
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['libs/video/rsx_cpu_surface.inc', 'libs/video/rsx_cpu_surface_profile.h', 'libs/video/rsx_d3d12_backend.c', 'libs/video/tests/test_cpu_surface_prompt*.c', 'tools/test_cpu_surface_prompt.py', '.github/workflows/cpu-surface-prompt.yml']
  pull_request:
    paths: ['libs/video/rsx_cpu_surface.inc', 'libs/video/rsx_cpu_surface_profile.h', 'libs/video/rsx_d3d12_backend.c', 'libs/video/tests/test_cpu_surface_prompt*.c', 'tools/test_cpu_surface_prompt.py', '.github/workflows/cpu-surface-prompt.yml']
  workflow_dispatch:
jobs:
  prompt:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_cpu_surface_prompt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-surface-prompt-${{ matrix.os }}
          path: |
            build/cpu-surface-prompt-tests/**/*.log
            build/cpu-surface-prompt-tests/**/*.json
          retention-days: 5

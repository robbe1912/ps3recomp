name: Native workload regressions
on:
  push:
    branches: [master, main, combined, 'codex/**']
    paths: ['runtime/spu/**', 'runtime/platform/**', 'runtime/memory/**', 'runtime/diag/spurs_scheduler_observer.c', 'libs/spurs/**', 'include/**', 'tests/test_spurs_scheduler.c', 'tests/spurs_scheduler_observer_fixture.h', 'tools/test_spurs_scheduler.py', 'tools/test_spu_native_leaf.py', 'tools/spu_owned_options.py', '.github/workflows/spu-native-leaf.yml']
  pull_request:
    paths: ['runtime/spu/**', 'runtime/platform/**', 'runtime/memory/**', 'runtime/diag/spurs_scheduler_observer.c', 'libs/spurs/**', 'include/**', 'tests/test_spurs_scheduler.c', 'tests/spurs_scheduler_observer_fixture.h', 'tools/test_spurs_scheduler.py', 'tools/test_spu_native_leaf.py', 'tools/spu_owned_options.py', '.github/workflows/spu-native-leaf.yml']
  workflow_dispatch:
jobs:
  native-leaf:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: python tools/test_spu_native_leaf.py
      - run: python tools/test_spurs_scheduler.py --mutants
      - name: Require actual scheduler execution
        shell: python
        run: |
          from pathlib import Path
          text = Path('build/spurs-scheduler-tests/run.log').read_text()
          assert 'SPURS runnable producer / blocked consumer / BUSY immutability / join PASS' in text
          assert 'SPURS same workload/lane across instances retains separate LS and TLS exit classification PASS' in text
          negative = Path('build/spurs-scheduler-tests/serialized-admission/run.log').read_text()
          assert 'runnable producer could not run' in negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-${{ matrix.os }}
          path: |
            build/spurs-scheduler-tests/**/*.log
            build/spurs-scheduler-tests/**/*.json
          retention-days: 5

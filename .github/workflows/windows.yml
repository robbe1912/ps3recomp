# Builds the runtime library on Windows, the only platform that can currently
# run a recompiled game.
#
# The macOS job guards the POSIX paths; this one guards the platform everything
# actually ships on. Without it, a change made to satisfy Clang could break the
# MSVC/clang-cl build and nothing would notice until someone tried to build a
# port -- which is the same class of drift that let docs/BUILDING.md advertise
# macOS support the tree did not have.
#
# clang-cl rather than plain cl: the loader uses __builtin_bswap* and weak
# symbols that MSVC does not provide (see docs/BUILDING.md).
name: Windows

on:
  push:
    branches: [ master, main, combined ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Puts cl, the Windows SDK and the MSVC headers on PATH. clang-cl needs
      # the MSVC headers even though it is doing the compiling, and the
      # conformance suite shells out to cl to build its generated driver.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Show toolchain
        run: |
          clang-cl --version
          ninja --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Build Windows Vulkan host and reject missing guest translation
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'ps3recomp-vulkan'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          $headers = Join-Path $deps 'headers.tar.gz'
          Invoke-WebRequest 'https://codeload.github.com/KhronosGroup/Vulkan-Headers/tar.gz/6802bb4733b63ed5efd3adb308a6c885ef180ea1' -OutFile $headers
          if ((Get-FileHash $headers -Algorithm SHA256).Hash -ne '9044fbb356160e43201dc2094acb44c8a906722a63a35f48fc0f051579db9bb6') { throw 'Vulkan-Headers digest mismatch' }
          tar -xf $headers -C $deps
          if ($LASTEXITCODE) { throw 'Vulkan-Headers extraction failed' }
          $sdl = Join-Path $deps 'sdl2.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip' -OutFile $sdl
          if ((Get-FileHash $sdl -Algorithm SHA256).Hash -ne 'af347939395a58b365846aaea27391e69f9ec9d4dd650d6ac40802159b418a6e') { throw 'SDL2 digest mismatch' }
          Expand-Archive -LiteralPath $sdl -DestinationPath $deps -Force
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_BUILD_TESTS=ON -DCMAKE_DISABLE_FIND_PACKAGE_glslang=ON "-DPS3RECOMP_VULKAN_INCLUDE_DIR=$deps/Vulkan-Headers-6802bb4733b63ed5efd3adb308a6c885ef180ea1/include" "-DSDL2_DIR=$deps/SDL2-2.32.10/cmake"
          if ($LASTEXITCODE) { throw 'Windows Vulkan configure failed' }
          cmake --build build-vulkan --parallel 4 --target ps3recomp_host
          if ($LASTEXITCODE) { throw 'Windows Vulkan host build failed' }
          ctest --test-dir build-vulkan -R '^rsx_vulkan_translation_required$' --no-tests=error --output-on-failure
          if ($LASTEXITCODE) { throw 'Missing-translation rejection contract failed' }

      - name: Memory allocation and FIFO trace regressions
        run: |
          cmake -S . -B build -DPS3RECOMP_BUILD_TESTS=ON
          cmake --build build --target test_spu_float_simd test_spu_mfc_registry test_rsx_pipeline_cache test_rsx_capture_schedule test_pad_file_normal test_pad_file_legacy test_rsx_slot_pool test_rsx_slot_pool_gpu test_rsx_shader_cache test_rsx_shader_cache_gpu test_rsx_depth_surfaces_gpu test_rsx_gpu_references test_rsx_gpu_pso_gpu test_rsx_gpu_submission test_rsx_fp_decompiler test_rsx_fp_pack_gpu test_rsx_fp_source_sign_gpu test_memory_container test_gcm_draw_trace test_rsx_upload_buffer test_rsx_upload_strip test_rsx_record_batch test_rsx_texture_remap test_rsx_timeline_select test_rsx_mrt_observer test_rsx_mrt_masks test_rsx_mrt_masks_gpu test_rsx_address_gpu test_rsx_address_tables test_rsx_depth_alias_gpu
          ctest --test-dir build -R "^(ppu_inline_read_sync|spu_float_simd|spu_mfc_registry|rsx_pipeline_cache|rsx_capture_schedule|pad_file_reports|rsx_slot_pool|rsx_slot_pool_gpu|rsx_depth_required|rsx_shader_cache|rsx_shader_cache_gpu|rsx_gpu_references|rsx_gpu_pso|rsx_gpu_submission|rsx_fp_decompiler|rsx_fp_pack|rsx_fp_source_sign|memory_container_allocation|gcm_draw_trace|rsx_upload_buffer|rsx_upload_strip|rsx_record_batch|rsx_texture_remap|rsx_timeline_select|rsx_mrt_observer|rsx_mrt_masks|rsx_mrt_masks_gpu|rsx_address|rsx_depth_alias)$" --output-on-failure

      - name: Verify the library exists
        shell: bash
        run: |
          ls -la build/ps3recomp_runtime.lib
          test -s build/ps3recomp_runtime.lib

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The same eight suites the macOS job runs. The conformance one compiles
      # and EXECUTES 1300+ lifted instruction cases; CI=1 makes it fail rather
      # than skip if no compiler is reachable, because a green tick meaning
      # "compiled nothing" is worse than a red one.
      - name: Run the lifter test suites
        shell: bash
        env:
          CI: "1"
        run: |
          set -e
          failed=0
          for t in tools/test_*.py; do
            echo "--- $t"
            if ! python "$t"; then
              echo "::error::$t failed"
              failed=1
            fi
          done
          exit "$failed"

      # runtime/ppu/ is the one part of the runtime no CMake target builds --
      # it needs the lifter's per-game ppu_recomp.h -- so it was only ever
      # compiled inside somebody's game port. Windows is where it works, so
      # this is a real gate here: the baseline is near zero and any new error
      # fails the job.
      - name: Check the PPU boot scaffold (ratchet)
        run: python tools/check_ppu_scaffold.py

      # RSX texture layout -- format class, row sizes, Morton addressing. Pure
      # Linux and macOS have run these since they were written; Windows never
      # did. That gap let a broken xswd case sit red on both POSIX runners
      # while Windows reported green, which is exactly the wrong way round for
      # the platform most contributors build on.
      - name: Staged native-module ownership and dispatch
        run: python tools/test_spu_stage_registry.py

      - name: Run self-contained SPU helper tests
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I runtime/spu /Fe:test_spu_helpers.exe runtime/spu/tests/test_spu_helpers.c runtime/spu/spu_float_simd.c runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_spu_helpers.exe

      - name: SPU extended float values and interpreter
        env:
          CC: clang-cl
        run: |
          python tools/test_spu_float.py
          python tools/test_spu_float.py --interpreter
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # libnet over host sockets (PS3_NET_ONLINE), end to end on loopback: every
      # handler is called through the NID it registered under.
      - name: Run the sys_net loopback test
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_sys_net.exe libs/network/tests/test_sys_net.c ws2_32.lib runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_sys_net.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Matching2 over psnr without a server: response relocation, attribute
      # packing, and the room structs a title reads.
      - name: Run the Matching2 test
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_np_matching2.exe libs/network/tests/test_np_matching2.c runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_np_matching2.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The player name: --username, PS3_NP_ONLINE_ID, the OS login online,
      # and PSN's online ID rules.
      - name: Run the player-name test
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_np_identity.exe libs/network/tests/test_np_identity.c ws2_32.lib runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_np_identity.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # NAT traversal: probing psnr from the P2P socket, dropping psnr's
      # packets before the title sees them, punching toward peers.
      - name: Run the NAT traversal test
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /Fe:test_np_nat.exe libs/network/tests/test_np_nat.c ws2_32.lib runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_np_nat.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # arithmetic with no host API in it, so it runs everywhere, and it is the
      # regression net for having lifted that maths out of the D3D12 uploader.
      # sync_stress has always been the Windows-native suite; now that its
      # source also builds on POSIX through the shim, this is what proves the
      # shared source still means the same thing here.
      - name: Build and run sync_stress
        run: |
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-sync-stress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build-sync-stress --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run memory capacity contract
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I runtime/syscalls /Fe:test_memory_capacity.exe runtime/syscalls/tests/test_memory_capacity.c runtime/syscalls/sys_memory.c runtime/syscalls/spu_ea_alias.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_memory_capacity.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run self-contained RSX tests
        # NOT shell: bash. Git Bash rewrites a leading-slash argument into a
        # Windows path, so /nologo arrived at the linker as an .obj under the
        # Git install directory. PowerShell leaves MSVC-style flags alone.
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_texture_layout.exe libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_texture_layout.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_rsx_primitives.exe libs/video/tests/test_rsx_primitives.c runtime/memory/guest_read_sync.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_rsx_primitives.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Packed XY16F render-target sampling (WARP)
        run: python tests/check_rsx_texture_alias.py

      - name: Run condition semantics regressions
        run: |
          cmake -S tests/sync_stress -B build-sync -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-sync --target test_cond_semantics
          ctest --test-dir build-sync -R "^cond_" --output-on-failure
